name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste real backups or personal data here. Issues are public.
        For a security problem, use the private report (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and phone
      placeholder: Firefox 140 on Android 15
  - type: dropdown
    id: installed
    attributes:
      label: How do you use the app?
      options:
        - Installed on the home screen
        - In a browser tab
